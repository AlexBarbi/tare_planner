# Aliengo (OptiPessiController) on FAST-LIO + terrainAnalysis(Ext), see legged_unitree_description/launch/tare_explore_nav_launch.xml.
# indoor.yaml with: FAST-LIO topics; no initial waypoint (12 m straight ahead, blind), no waypoint extension and a
# shorter lookahead, because OptiPessi walks straight to /way_point (relayed to /opti_pessi/goal) with no local planner
# in between; terrain collision threshold below the terrainAnalysis vehicleHeight (0.4, terrain intensities never
# exceed it), at FAR's terrain_free_Z; FAR's sensor_range.
# Narrow indoor (corridors, ~0.8 m doors), tuned 2026-09-23; indoor.yaml values in brackets:
#  - kViewPointCollisionMargin 0.25 [0.5]: a viewpoint is dropped when an obstacle point is this close in xy. Obstacle
#    points are binned into the collision grid first and the margin is measured from the cell centre, so the effective
#    margin is margin + half a collision cell. Aliengo is 0.31 m wide: 0.25 leaves ~10 cm to a wall at a viewpoint.
#  - kCollisionGridResolutionX/Y 0.1 [0.2]: the binning slack above drops from 0.1 to 0.05 m.
#  - viewpoint_manager/resolution_x/y 0.3 [0.6]: a door of width w keeps a free viewpoint wherever the grid falls only if
#    w >= 2 * (margin + 0.05) + resolution = 0.9 m (1.2 m with the first narrow tuning 0.3/0.2/0.4, 2.2 m in indoor.yaml).
#    An axis-aligned 0.8 m door gets one about 70-85% of the time. number_x/y 70 [50] (must stay a multiple of 5, the
#    rollover step is number / 5): local horizon 70 * 0.3 = 21 m, global subspace cells 21 / 5 = 4.2 m; ~2x the
#    viewpoints (and viewpoint update time) of the 50 x 50 grid.
#  - keypose_graph/kAddEdgeCollisionCheckRadius 0.25 [0.4]: same margin for keypose edges, which the global path follows.
#  - kSensorRange 7.5 [7.5]: the coverage model assumes +-12 deg vertical FOV all round; the L2 is mounted upside down
#    (pitch 164.9 deg) and above its plane only sees forward, up to ~+15 deg. At 10 m TARE counted rooms seen through a
#    door as covered.
#  - kCheckDynamicObstacleCollision true [false]: a viewpoint in collision stays so until the local horizon rolls it out;
#    with this, it is freed once it has had no obstacle point for more than kCollisionFrameCountMax updates and lies
#    between the robot and an obstacle seen now (people who walked away, SLAM noise), instead of blocking a door or
#    cutting the viewpoint graph.
#  - kMinAddPointNumSmall 4 [40], kMinAddPointNumBig 6 [60], kMinAddFrontierPointNum 4 [20]: in a corridor a viewpoint
#    adds a few uncovered surface / frontier points, not a wall's worth (a 2 x 1.8 m wall is ~40 points at a 0.3 leaf),
#    so viewpoints were not selected and cells turned COVERED with rooms behind doors unexplored.
#  - kSurfaceCloudDwzLeafSize stays 0.3 (the thresholds above count points of this cloud; smaller leaves inflate them).
#  - kExtendWayPoint must stay false: tare_path_to_opti_pessi_goal.py matches /way_point to the path it lies on.
tare_planner_node:
  ros__parameters:
    sub_start_exploration_topic_ : /start_exploration
    sub_terrain_map_topic_ : /terrain_map
    sub_terrain_map_ext_topic_ : /terrain_map_ext
    sub_state_estimation_topic_ : /Odometry
    sub_registered_scan_topic_ : /cloud_registered
    sub_coverage_boundary_topic_ : /sensor_coverage_planner/coverage_boundary
    sub_viewpoint_boundary_topic_ : /navigation_boundary
    sub_nogo_boundary_topic_ : /sensor_coverage_planner/nogo_boundary
    sub_joystick_topic_ : /joy
    sub_reset_waypoint_topic_ : /reset_waypoint
    pub_exploration_finish_topic_ : exploration_finish
    pub_runtime_breakdown_topic_ : runtime_breakdown
    pub_runtime_topic_ : /runtime
    pub_waypoint_topic_ : /way_point
    pub_momentum_activation_count_topic_ : momentum_activation_count

    kAutoStart : false
    kRushHome : true
    kUseTerrainHeight : false
    kCheckTerrainCollision : true
    kExtendWayPoint : false
    kUseLineOfSightLookAheadPoint : true
    kNoExplorationReturnHome : true
    kExtendWayPointDistanceBig : 8.0
    kExtendWayPointDistanceSmall : 3.5
    kInitialWaypointDistance : 0.0
    kKeyposeCloudDwzFilterLeafSize : 0.2
    kRushHomeDist : 5.0
    kAtHomeDistThreshold : 0.5
    kTerrainCollisionThreshold : 0.15
    kLookAheadDistance : 5.0
    kUseMomentum : false 
    kDirectionChangeCounterThr : 6
    kDirectionNoChangeCounterThr : 5
    kResetWaypointJoystickAxesID : 2

    # PlanningEnv
    kUseFrontier : true
    kFrontierClusterTolerance : 1.0
    kFrontierClusterMinSize : 10
    kUseCoverageBoundaryOnFrontier : false 
    kUseCoverageBoundaryOnObjectSurface : false

    # Rolling occupancy grid
    rolling_occupancy_grid/resolution_x : 0.3
    rolling_occupancy_grid/resolution_y : 0.3
    rolling_occupancy_grid/resolution_z : 0.3
    # Local patch: lidar rays free occupied cells no longer hit (people who walked away), and surface points left in
    # free cells are not coverage targets. Upstream keeps a cell occupied until it rolls out of the grid.
    rolling_occupancy_grid/kClearDynamicObstacle : true

    kSurfaceCloudDwzLeafSize : 0.3
    kCollisionCloudDwzLeafSize : 0.2
    kKeyposeCloudStackNum : 5
    kPointCloudRowNum : 50
    kPointCloudColNum : 50
    kPointCloudLevelNum : 30
    kMaxCellPointNum : 100000
    kPointCloudCellSize : 18.0
    kPointCloudCellHeight : 1.8
    kPointCloudManagerNeighborCellNum : 5
    kCoverCloudZSqueezeRatio : 2.0

    # KeyposeGraph
    keypose_graph/kAddNodeMinDist : 1.0
    keypose_graph/kAddNonKeyposeNodeMinDist : 0.5
    keypose_graph/kAddEdgeConnectDistThr : 3.0
    keypose_graph/kAddEdgeToLastKeyposeDistThr : 3.0
    keypose_graph/kAddEdgeVerticalThreshold : 1.0
    keypose_graph/kAddEdgeCollisionCheckResolution : 0.4
    keypose_graph/kAddEdgeCollisionCheckRadius : 0.25
    keypose_graph/kAddEdgeCollisionCheckPointNumThr : 1

    # ViewPointManager
    viewpoint_manager/number_x : 70
    viewpoint_manager/number_y : 70
    viewpoint_manager/number_z : 1
    viewpoint_manager/resolution_x : 0.3
    viewpoint_manager/resolution_y : 0.3
    viewpoint_manager/resolution_z : 0.0
    kConnectivityHeightDiffThr : 0.25
    kGreedyViewPointSampleRange : 3
    kLocalPathOptimizationItrMax : 10
    kViewPointCollisionMargin : 0.25
    kViewPointCollisionMarginZPlus : 0.5
    kViewPointCollisionMarginZMinus : 0.5
    kCollisionGridZScale : 1.0
    kCollisionGridResolutionX : 0.1
    kCollisionGridResolutionY : 0.1
    kCollisionGridResolutionZ : 0.0
    kCollisionPointThr : 1
    kLineOfSightStopAtNearestObstacle : false
    kViewPointHeightFromTerrain : 0.75
    kViewPointHeightFromTerrainChangeThreshold : 0.6
    kCheckDynamicObstacleCollision : true
    kCollisionFrameCountMax : 3

    kSensorRange : 7.5
    kNeighborRange : 3.0
    kCoverageOcclusionThr : 0.3
    kCoverageDilationRadius : 0.5

    # Grid World
    kGridWorldXNum : 121
    kGridWorldYNum : 121
    kGridWorldZNum : 121
    kGridWorldCellHeight : 3.0
    kGridWorldNearbyGridNum : 5
    kMinAddPointNumSmall : 4
    kMinAddPointNumBig : 6
    kMinAddFrontierPointNum : 4
    kCellExploringToCoveredThr : 1
    kCellCoveredToExploringThr: 10
    kCellExploringToAlmostCoveredThr: 10
    kCellAlmostCoveredToExploringThr: 20
    kCellUnknownToExploringThr: 1

    # Visualization
    kExploringSubspaceMarkerColorGradientAlpha : true
    kExploringSubspaceMarkerColorMaxAlpha : 0.8
    kExploringSubspaceMarkerColorR : 0.0
    kExploringSubspaceMarkerColorG : 1.0
    kExploringSubspaceMarkerColorB : 0.0
    kExploringSubspaceMarkerColorA : 1.0
    kLocalPlanningHorizonMarkerColorR : 0.0
    kLocalPlanningHorizonMarkerColorG : 1.0
    kLocalPlanningHorizonMarkerColorB : 0.0
    kLocalPlanningHorizonMarkerColorA : 1.0
    kLocalPlanningHorizonMarkerWidth : 0.3
    kLocalPlanningHorizonHeight : 3.0